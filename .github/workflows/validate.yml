name: ASTRA validation

on:
  push:
    branches:
      - main
      - feature/personal-companion-mvp
  pull_request:
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api/chat.js
          node --check sw.js
          node --check tests/smoke-check.js
      - name: Run ASTRA smoke checks
        run: node tests/smoke-check.js
